<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Web Clone</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; user-select: none; }
        canvas { display: block; }
        
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 8px; height: 8px;
            margin-top: -4px; margin-left: -4px;
            background-color: white;
            border: 1px solid black;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
        }

        #hotbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            background: rgba(0,0,0,0.6);
            padding: 6px;
            border-radius: 8px;
            z-index: 10;
        }

        .slot {
            width: 50px;
            height: 50px;
            border: 2px solid #555;
            margin: 0 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 11px;
            font-weight: bold;
            background: #222;
        }

        .slot.active {
            border-color: #fff;
            background: #444;
        }

        #instructions {
            position: absolute;
            top: 10px; left: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 12px;
            font-size: 13px;
            border-radius: 6px;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="crosshair"></div>
    <div id="instructions">
        <b>Управление:</b><br>
        🖱️ Клик по экрану — Начать игру<br>
        🏃 WASD — Перемещение<br>
        🦘 Пробел — Прыжок<br>
        ⛏️ ЛКМ — Сломать блок<br>
        🧱 ПКМ — Поставить блок<br>
        🔢 1-4 — Выбор блока
    </div>

    <div id="hotbar">
        <div class="slot active" id="slot-1">Трава</div>
        <div class="slot" id="slot-2">Земля</div>
        <div class="slot" id="slot-3">Камень</div>
        <div class="slot" id="slot-4">Дерево</div>
    </div>

    <!-- Исправленное подключение Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 1. Сцена и Камера
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Свет
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.4);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // 2. Генерация процедурных текстур (без внешних файлов)
        function createTexture(color) {
            const canvas = document.createElement('canvas');
            canvas.width = 16;
            canvas.height = 16;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = color;
            ctx.fillRect(0, 0, 16, 16);
            
            // Добавляем пиксельный шум
            for(let i = 0; i < 16; i++) {
                for(let j = 0; j < 16; j++) {
                    if(Math.random() > 0.5) {
                        ctx.fillStyle = 'rgba(0,0,0,0.1)';
                        ctx.fillRect(i, j, 1, 1);
                    }
                }
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter;
            return new THREE.MeshLambertMaterial({ map: texture });
        }

        const materials = {
            grass: createTexture('#557a2b'),
            dirt: createTexture('#866043'),
            stone: createTexture('#808080'),
            wood: createTexture('#674a27')
        };

        // 3. Генерация мира
        const blockGeo = new THREE.BoxGeometry(1, 1, 1);
        const blocks = new Map();

        function addBlock(x, y, z, type) {
            const key = `${x},${y},${z}`;
            const mesh = new THREE.Mesh(blockGeo, materials[type]);
            mesh.position.set(x, y, z);
            mesh.userData = { type, key };
            scene.add(mesh);
            blocks.set(key, mesh);
        }

        function removeBlock(key) {
            if (blocks.has(key)) {
                scene.remove(blocks.get(key));
                blocks.delete(key);
            }
        }

        // Построитель ландшафта
        const size = 12;
        for (let x = -size; x <= size; x++) {
            for (let z = -size; z <= size; z++) {
                let h = Math.floor(Math.sin(x * 0.3) * Math.cos(z * 0.3) * 2) + 2;
                for (let y = 0; y <= h; y++) {
                    let type = (y === h) ? 'grass' : (y > h - 2) ? 'dirt' : 'stone';
                    addBlock(x, y, z, type);
                }
            }
        }

        // 4. Управление и физика
        camera.position.set(0, 6, 0);
        let moveF = false, moveB = false, moveL = false, moveR = false;
        let velY = 0, canJump = false;
        let yaw = 0, pitch = 0;

        document.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
                
                camera.rotation.order = "YXZ";
                camera.rotation.y = yaw;
                camera.rotation.x = pitch;
            }
        });

        const blockTypes = ['grass', 'dirt', 'stone', 'wood'];
        let activeTypeIdx = 0;

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') moveF = true;
            if (e.code === 'KeyS') moveB = true;
            if (e.code === 'KeyA') moveL = true;
            if (e.code === 'KeyD') moveR = true;
            if (e.code === 'Space' && canJump) { velY = 0.12; canJump = false; }

            if (['Digit1', 'Digit2', 'Digit3', 'Digit4'].includes(e.code)) {
                activeTypeIdx = parseInt(e.key) - 1;
                document.querySelectorAll('.slot').forEach((el, idx) => {
                    el.classList.toggle('active', idx === activeTypeIdx);
                });
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') moveF = false;
            if (e.code === 'KeyS') moveB = false;
            if (e.code === 'KeyA') moveL = false;
            if (e.code === 'KeyD') moveR = false;
        });

        // 5. Взаимодействие (ЛКМ / ПКМ)
        const raycaster = new THREE.Raycaster();
        window.addEventListener('mousedown', (e) => {
            if (document.pointerLockElement !== document.body) return;

            raycaster.setFromCamera({ x: 0, y: 0 }, camera);
            const intersects = raycaster.intersectObjects(Array.from(blocks.values()));

            if (intersects.length > 0 && intersects[0].distance < 6) {
                const hit = intersects[0];
                if (e.button === 0) {
                    removeBlock(hit.object.userData.key);
                } else if (e.button === 2) {
                    const n = hit.face.normal;
                    const p = hit.object.position;
                    addBlock(p.x + n.x, p.y + n.y, p.z + n.z, blockTypes[activeTypeIdx]);
                }
            }
        });

        window.addEventListener('contextmenu', e => e.preventDefault());

        // 6. Игровой цикл
        function animate() {
            requestAnimationFrame(animate);

            const dir = new THREE.Vector3();
            if (moveF) dir.z -= 1;
            if (moveB) dir.z += 1;
            if (moveL) dir.x -= 1;
            if (moveR) dir.x += 1;
            dir.normalize();
            dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

            camera.position.addScaledVector(dir, 0.08);

            // Простая гравитация
            camera.position.y += velY;
            velY -= 0.005;

            if (camera.position.y < 4) {
                camera.position.y = 4;
                velY = 0;
                canJump = true;
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
