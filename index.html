<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Minecraft Mobile Clone</title>
    <style>
        * { touch-action: manipulation; }
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; user-select: none; -webkit-user-select: none; }
        canvas { display: block; }
        
        /* Прицел */
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 8px; height: 8px;
            margin-top: -4px; margin-left: -4px;
            background-color: white;
            border: 1px solid black;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
        }

        /* Хотбар / Инвентарь */
        #hotbar {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            background: rgba(0,0,0,0.6);
            padding: 4px;
            border-radius: 8px;
            z-index: 20;
        }

        .slot {
            width: 48px;
            height: 48px;
            border: 2px solid #555;
            margin: 0 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 10px;
            font-weight: bold;
            background: #222;
            border-radius: 4px;
            text-align: center;
        }

        .slot.active {
            border-color: #fff;
            background: #555;
        }

        /* Мобильное управление */
        #joystick-container {
            position: absolute;
            bottom: 30px;
            left: 20px;
            width: 100px;
            height: 100px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            z-index: 20;
        }

        #joystick-stick {
            position: absolute;
            top: 30px;
            left: 30px;
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.6);
            border-radius: 50%;
        }

        #jump-btn {
            position: absolute;
            bottom: 30px;
            right: 20px;
            width: 65px;
            height: 65px;
            background: rgba(255,255,255,0.3);
            border: 2px solid white;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        /* Круглая кнопка режима над прыжком */
        #action-btn {
            position: absolute;
            bottom: 110px;
            right: 20px;
            width: 65px;
            height: 65px;
            background: rgba(255,255,255,0.3);
            border: 2px solid white;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="crosshair"></div>
    
    <div id="action-btn">ЛОМАТЬ</div>
    <div id="jump-btn">ПРАЖОК</div>

    <div id="hotbar">
        <div class="slot active" onclick="selectSlot(0)">Трава</div>
        <div class="slot" onclick="selectSlot(1)">Земля</div>
        <div class="slot" onclick="selectSlot(2)">Камень</div>
        <div class="slot" onclick="selectSlot(3)">Дерево</div>
        <div class="slot" onclick="selectSlot(4)">Доски</div>
        <div class="slot" onclick="selectSlot(5)">Железо</div>
    </div>

    <div id="joystick-container">
        <div id="joystick-stick"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 1. Сцена и камера
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.4);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // 2. Генерация пиксельных текстур
        function createPixelTexture(color, noise = true) {
            const canvas = document.createElement('canvas');
            canvas.width = 16;
            canvas.height = 16;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = color;
            ctx.fillRect(0, 0, 16, 16);
            
            if (noise) {
                for(let i = 0; i < 16; i++) {
                    for(let j = 0; j < 16; j++) {
                        if(Math.random() > 0.6) {
                            ctx.fillStyle = 'rgba(0,0,0,0.12)';
                            ctx.fillRect(i, j, 1, 1);
                        }
                    }
                }
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter;
            return new THREE.MeshLambertMaterial({ map: texture });
        }

        function createGrassSideTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 16;
            canvas.height = 16;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#866043';
            ctx.fillRect(0, 0, 16, 16);
            ctx.fillStyle = '#557a2b';
            ctx.fillRect(0, 0, 16, 4);
            for(let i = 0; i < 16; i++) {
                if(Math.random() > 0.5) ctx.fillRect(i, 4, 1, 2);
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter;
            return new THREE.MeshLambertMaterial({ map: texture });
        }

        const matDirt = createPixelTexture('#866043');
        const matGrassTop = createPixelTexture('#557a2b');
        const matGrassSide = createGrassSideTexture();
        const matStone = createPixelTexture('#808080');
        const matWood = createPixelTexture('#674a27');
        const matPlanks = createPixelTexture('#a0754c');
        const matIronOre = createPixelTexture('#d8af93');
        const matSkin = createPixelTexture('#c58c65', false); // Текстура кожи для руки

        const materials = {
            grass: [matGrassSide, matGrassSide, matGrassTop, matDirt, matGrassSide, matGrassSide],
            dirt: matDirt,
            stone: matStone,
            wood: matWood,
            planks: matPlanks,
            iron: matIronOre
        };

        // 3. Рука игрока и удерживаемый предмет
        const armGroup = new THREE.Group();
        
        // Прямоугольная рука
        const armGeo = new THREE.BoxGeometry(0.25, 0.7, 0.25);
        const armMesh = new THREE.Mesh(armGeo, matSkin);
        armMesh.position.set(0, -0.2, 0);
        armGroup.add(armMesh);

        // Мини-блок в руке
        const itemInHandGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
        let itemInHandMesh = new THREE.Mesh(itemInHandGeo, materials.grass);
        itemInHandMesh.position.set(0, 0.25, -0.15);
        armGroup.add(itemInHandMesh);

        // Позиционируем руку перед камерой
        armGroup.position.set(0.4, -0.4, -0.6);
        armGroup.rotation.y = -Math.PI / 8;
        camera.add(armGroup);
        scene.add(camera);

        // 4. Построение мира
        const blockGeo = new THREE.BoxGeometry(1, 1, 1);
        const blocks = new Map();

        function addBlock(x, y, z, type) {
            const key = `${x},${y},${z}`;
            const mesh = new THREE.Mesh(blockGeo, materials[type]);
            mesh.position.set(x, y, z);
            mesh.userData = { type, key };
            scene.add(mesh);
            blocks.set(key, mesh);
        }

        function removeBlock(key) {
            if (blocks.has(key)) {
                scene.remove(blocks.get(key));
                blocks.delete(key);
            }
        }

        const size = 10;
        for (let x = -size; x <= size; x++) {
            for (let z = -size; z <= size; z++) {
                let h = Math.floor(Math.sin(x * 0.3) * Math.cos(z * 0.3) * 2) + 2;
                for (let y = 0; y <= h; y++) {
                    let type = (y === h) ? 'grass' : (y > h - 2) ? 'dirt' : 'stone';
                    addBlock(x, y, z, type);
                }
            }
        }

        // 5. Переключение слотов и обновление предмета в руке
        const blockTypes = ['grass', 'dirt', 'stone', 'wood', 'planks', 'iron'];
        let activeTypeIdx = 0;

        window.selectSlot = function(idx) {
            activeTypeIdx = idx;
            document.querySelectorAll('.slot').forEach((el, i) => {
                el.classList.toggle('active', i === idx);
            });
            
            // Обновляем предмет в руке
            const selectedType = blockTypes[idx];
            itemInHandMesh.material = materials[selectedType];
        };

        // 6. Управление
        camera.position.set(0, 5, 0);
        let moveVector = { x: 0, z: 0 };
        let velY = 0, canJump = false;
        let isBuildMode = false;

        // Кнопка режима (Ломать / Ставить)
        const actionBtn = document.getElementById('action-btn');
        actionBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            e.stopPropagation();
            isBuildMode = !isBuildMode;
            actionBtn.innerText = isBuildMode ? "СТАВИТЬ" : "ЛОМАТЬ";
        });

        // Джойстик
        const joyContainer = document.getElementById('joystick-container');
        const joyStick = document.getElementById('joystick-stick');

        joyContainer.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = joyContainer.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            const dist = Math.min(Math.hypot(dx, dy), 35);
            const angle = Math.atan2(dy, dx);

            joyStick.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
            moveVector.x = Math.cos(angle) * (dist / 35);
            moveVector.z = Math.sin(angle) * (dist / 35);
        });

        joyContainer.addEventListener('touchend', () => {
            joyStick.style.transform = 'translate(0px, 0px)';
            moveVector = { x: 0, z: 0 };
        });

        // Прыжок
        const jumpBtn = document.getElementById('jump-btn');
        jumpBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (canJump) { velY = 0.12; canJump = false; }
        });

        // Взаимодействие с миром
        const raycaster = new THREE.Raycaster();
        let touchStartX = 0, touchStartY = 0;

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1 && e.target.tagName === 'CANVAS') {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }
        });

        window.addEventListener('touchend', (e) => {
            if (e.changedTouches.length === 1 && e.target.tagName === 'CANVAS') {
                const endX = e.changedTouches[0].clientX;
                const endY = e.changedTouches[0].clientY;

                if (Math.hypot(endX - touchStartX, endY - touchStartY) < 10) {
                    const mouse = new THREE.Vector2(
                        (endX / window.innerWidth) * 2 - 1,
                        -(endY / window.innerHeight) * 2 + 1
                    );
                    
                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(Array.from(blocks.values()));

                    if (intersects.length > 0 && intersects[0].distance < 6) {
                        const hit = intersects[0];
                        
                        // Анимация удара рукой
                        armGroup.position.z = -0.4;
                        setTimeout(() => { armGroup.position.z = -0.6; }, 100);

                        if (!isBuildMode) {
                            removeBlock(hit.object.userData.key);
                        } else {
                            const n = hit.face.normal;
                            const p = hit.object.position;
                            addBlock(p.x + n.x, p.y + n.y, p.z + n.z, blockTypes[activeTypeIdx]);
                        }
                    }
                }
            }
        });

        // 7. Игровой цикл
        function animate() {
            requestAnimationFrame(animate);

            camera.translateX(moveVector.x * 0.08);
            camera.translateZ(moveVector.z * 0.08);

            camera.position.y += velY;
            velY -= 0.005;

            if (camera.position.y < 4) {
                camera.position.y = 4;
                velY = 0;
                canJump = true;
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

            }
        }
