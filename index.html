<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Web Clone</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; user-select: none; }
        canvas { display: block; }
        
        /* UI Элементы */
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 10px; height: 10px;
            margin-top: -5px; margin-left: -5px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
        }

        #hotbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            background: rgba(0,0,0,0.5);
            padding: 5px;
            border-radius: 5px;
        }

        .slot {
            width: 50px;
            height: 50px;
            border: 2px solid #555;
            margin: 0 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 12px;
            background-size: cover;
        }

        .slot.active {
            border-color: #fff;
            background-color: rgba(255,255,255,0.2);
        }

        #instructions {
            position: absolute;
            top: 10px; left: 10px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            font-size: 14px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div id="crosshair"></div>
    <div id="instructions">
        <b>Управление:</b><br>
        Клик по экрану — Начать игру<br>
        WASD — Перемещение<br>
        Пробел — Прыжок<br>
        ЛКМ — Сломать блок<br>
        ПКМ — Поставить блок<br>
        1-4 — Выбор блока в хотбаре
    </div>

    <div id="hotbar">
        <div class="slot active" id="slot-1">Трава</div>
        <div class="slot" id="slot-2">Земля</div>
        <div class="slot" id="slot-3">Камень</div>
        <div class="slot" id="slot-4">Дерево</div>
    </div>

    <!-- Подключаем библиотеку Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.min.js"></script>
    <script>
        // === ИНИЦИАЛИЗА СЦЕНЫ И КАМЕРЫ ===
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Цвет неба
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Осветление
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // === ПРОСТЫЕ ТЕКСТУРЫ (ПРОГРАММНЫЕ) ===
        function createBlockTexture(color) {
            const canvas = document.createElement('canvas');
            canvas.width = 16;
            canvas.height = 16;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = color;
            ctx.fillRect(0, 0, 16, 16);
            // Добавляем пиксельный шум для текстуры
            for(let i=0; i<16; i++) {
                for(let j=0; j<16; j++) {
                    if(Math.random() > 0.6) {
                        ctx.fillStyle = 'rgba(0,0,0,0.1)';
                        ctx.fillRect(i, j, 1, 1);
                    }
                }
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter;
            return new THREE.MeshLambertMaterial({ map: texture });
        }

        const materials = {
            grass: createBlockTexture('#557a2b'),
            dirt: createBlockTexture('#866043'),
            stone: createBlockTexture('#808080'),
            wood: createBlockTexture('#674a27')
        };

        // === ГЕНЕРАЦИЯ МИРА ===
        const blockGeometry = new THREE.BoxGeometry(1, 1, 1);
        const blocks = new Map();

        function setBlock(x, y, z, materialType) {
            const key = `${x},${y},${z}`;
            const mesh = new THREE.Mesh(blockGeometry, materials[materialType]);
            mesh.position.set(x, y, z);
            mesh.userData = { type: materialType, key: key };
            scene.add(mesh);
            blocks.set(key, mesh);
        }

        function removeBlock(key) {
            if (blocks.has(key)) {
                scene.remove(blocks.get(key));
                blocks.delete(key);
            }
        }

        // Генерация ландшафта (16x16)
        const worldSize = 16;
        for (let x = -worldSize/2; x < worldSize/2; x++) {
            for (let z = -worldSize/2; z < worldSize/2; z++) {
                let height = Math.floor(Math.sin(x * 0.2) * Math.cos(z * 0.2) * 2) + 2;
                
                for (let y = 0; y <= height; y++) {
                    let type = 'stone';
                    if (y === height) type = 'grass';
                    else if (y > height - 2) type = 'dirt';
                    
                    setBlock(x, y, z, type);
                }
            }
        }

        // === ФИЗИКА И УПРАВЛЕНИЕ ИГРОКОМ ===
        camera.position.set(0, 5, 0);
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let velocityY = 0;
        let isGrounded = false;
        const speed = 0.1;
        const gravity = 0.008;

        // Поворот камеры
        let yaw = 0, pitch = 0;
        document.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
                
                camera.rotation.order = "YXZ";
                camera.rotation.y = yaw;
                camera.rotation.x = pitch;
            }
        });

        // Обработка клавиш
        const selectedType = ['grass', 'dirt', 'stone', 'wood'];
        let activeSlot = 0;

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') moveForward = true;
            if (e.code === 'KeyS') moveBackward = true;
            if (e.code === 'KeyA') moveLeft = true;
            if (e.code === 'KeyD') moveRight = true;
            if (e.code === 'Space' && isGrounded) { velocityY = 0.15; isGrounded = false; }

            // Выбор слота
            if (['Digit1', 'Digit2', 'Digit3', 'Digit4'].includes(e.code)) {
                activeSlot = parseInt(e.key) - 1;
                document.querySelectorAll('.slot').forEach((el, idx) => {
                    el.classList.toggle('active', idx === activeSlot);
                });
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') moveForward = false;
            if (e.code === 'KeyS') moveBackward = false;
            if (e.code === 'KeyA') moveLeft = false;
            if (e.code === 'KeyD') moveRight = false;
        });

        // === ВЗАИМОДЕЙСТВИЕ С БЛОКАМИ (ЛКМ / ПКМ) ===
        const raycaster = new THREE.Raycaster();
        
        window.addEventListener('mousedown', (e) => {
            if (document.pointerLockElement !== document.body) return;

            raycaster.setFromCamera({ x: 0, y: 0 }, camera);
            const intersects = raycaster.intersectObjects(Array.from(blocks.values()));

            if (intersects.length > 0 && intersects[0].distance < 6) {
                const intersect = intersects[0];

                if (e.button === 0) { // ЛКМ - ломать
                    removeBlock(intersect.object.userData.key);
                } else if (e.button === 2) { // ПКМ - ставить
                    const normal = intersect.face.normal;
                    const pos = intersect.object.position;
                    const newX = pos.x + normal.x;
                    const newY = pos.y + normal.y;
                    const newZ = pos.z + normal.z;
                    setBlock(newX, newY, newZ, selectedType[activeSlot]);
                }
            }
        });

        // Отключение контекстного меню по ПКМ
        window.addEventListener('contextmenu', e => e.preventDefault());

        // === ИГРОВОЙ ЦИКЛ (ANIMATION LOOP) ===
        function animate() {
            requestAnimationFrame(animate);

            // Движение игрока
            const dir = new THREE.Vector3();
            if (moveForward) dir.z -= 1;
            if (moveBackward) dir.z += 1;
            if (moveLeft) dir.x -= 1;
            if (moveRight) dir.x += 1;
            dir.normalize();
            dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

            camera.position.addScaledVector(dir, speed);

            // Простая гравитация
            camera.position.y += velocityY;
            velocityY -= gravity;

            // Пол (базовая проверка)
            if (camera.position.y < 3) {
                camera.position.y = 3;
                velocityY = 0;
                isGrounded = true;
            }

            renderer.render(scene, camera);
        }

        animate();

        // Адаптация окна
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
