<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Minecraft Mobile Online</title>
  <style>
    * { touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; }

    /* Сенсорный джойстик */
    #joystick-zone {
      position: absolute; bottom: 30px; left: 30px;
      width: 120px; height: 120px;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%; z-index: 10;
    }
    #joystick-knob {
      position: absolute; top: 35px; left: 35px;
      width: 50px; height: 50px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
    }

    /* Кнопки интерфейса */
    #btn-inv {
      position: absolute; top: 20px; right: 20px;
      padding: 12px 20px; background: rgba(0,0,0,0.7);
      color: #fff; border: 2px solid #fff; border-radius: 8px;
      font-weight: bold; font-size: 14px; z-index: 10;
    }

    #info-panel {
      position: absolute; top: 20px; left: 20px;
      color: #fff; background: rgba(0,0,0,0.6);
      padding: 10px; border-radius: 6px; font-size: 12px; z-index: 10;
    }

    /* Панель хотбара */
    #hotbar {
      position: absolute; bottom: 15px; left: 50%;
      transform: translateX(-50%); display: flex; gap: 6px;
      background: rgba(0,0,0,0.6); padding: 5px; border-radius: 8px; z-index: 10;
    }
    .slot {
      width: 45px; height: 45px; background: rgba(255,255,255,0.15);
      border: 2px solid #888; border-radius: 5px; color: #fff;
      font-size: 10px; display: flex; align-items: center; justify-content: center;
      text-align: center;
    }
    .slot.active { border-color: #ffe600; background: rgba(255,230,0,0.3); }

    /* Окно Инвентаря */
    #inventory-modal {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85); display: none; flex-direction: column;
      align-items: center; justify-content: center; z-index: 20; color: #fff;
    }
    #inventory-modal.show { display: flex; }
    .inv-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
      max-width: 90vw; max-height: 70vh; overflow-y: auto; padding: 10px;
    }
    .inv-card {
      width: 70px; height: 70px; background: #2a2a2a; border: 2px solid #555;
      border-radius: 8px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; font-size: 11px; text-align: center;
    }
    .inv-card:active { border-color: #00ffcc; background: #444; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="info-panel">
  <b>Minecraft Mobile</b><br>
  Роль: Создатель
</div>

<button id="btn-inv">ИНВЕНТАРЬ</button>

<div id="joystick-zone"><div id="joystick-knob"></div></div>

<div id="hotbar">
  <div class="slot active" id="slot-0">Меч</div>
  <div class="slot" id="slot-1">Кирка</div>
  <div class="slot" id="slot-2">Блок</div>
</div>

<div id="inventory-modal">
  <h2>Инвентарь Игрока</h2>
  <div class="inv-grid" id="inv-items"></div>
  <button id="btn-close-inv" style="margin-top:15px; padding:10px 30px; background:#e74c3c; color:#fff; border:none; border-radius:5px;">Закрыть</button>
</div>

<script>
  // ==========================================
  // 1. ГЕНЕРАЦИЯ ПИКСЕЛЬНЫХ ТЕКСТУР (Canvas)
  // ==========================================
  function generateTexture(colorHex, noiseAmount = 0.15) {
    const canvas = document.createElement('canvas');
    canvas.width = 16; canvas.height = 16;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = colorHex;
    ctx.fillRect(0, 0, 16, 16);
    
    for (let x = 0; x < 16; x++) {
      for (let y = 0; y < 16; y++) {
        if (Math.random() < noiseAmount) {
          ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.15)';
          ctx.fillRect(x, y, 1, 1);
        }
      }
    }
    const texture = new THREE.CanvasTexture(canvas);
    texture.magFilter = THREE.NearestFilter;
    texture.minFilter = THREE.NearestFilter;
    return texture;
  }

  const textures = {
    grass: generateTexture('#55aa33'),
    dirt: generateTexture('#795538'),
    wood: generateTexture('#5c4033'),
    leaves: generateTexture('#2d8a4e'),
    stone: generateTexture('#888888'),
    planks: generateTexture('#b8860b')
  };

  const materials = {
    grass: new THREE.MeshLambertMaterial({ map: textures.grass }),
    dirt: new THREE.MeshLambertMaterial({ map: textures.dirt }),
    wood: new THREE.MeshLambertMaterial({ map: textures.wood }),
    leaves: new THREE.MeshLambertMaterial({ map: textures.leaves }),
    stone: new THREE.MeshLambertMaterial({ map: textures.stone }),
    planks: new THREE.MeshLambertMaterial({ map: textures.planks }),
    skin: new THREE.MeshLambertMaterial({ color: 0xffdbac })
  };

  // ==========================================
  // 2. СОЗДАНИЕ 3D-СЦЕНЫ
  // ==========================================
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x78a7ff);

  const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
  scene.add(ambientLight);
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
  dirLight.position.set(20, 40, 20);
  scene.add(dirLight);

  // ==========================================
  // 3. ГЕНЕРАЦИЯ МИРА (Блоки, Деревья, Дома)
  // ==========================================
  const boxGeo = new THREE.BoxGeometry(1, 1, 1);
  const worldSize = 24;

  for (let x = -worldSize/2; x < worldSize/2; x++) {
    for (let z = -worldSize/2; z < worldSize/2; z++) {
      const gBlock = new THREE.Mesh(boxGeo, materials.grass);
      gBlock.position.set(x, 0, z);
      scene.add(gBlock);

      const dBlock = new THREE.Mesh(boxGeo, materials.dirt);
      dBlock.position.set(x, -1, z);
      scene.add(dBlock);
    }
  }

  function spawnTree(x, z) {
    for (let y = 1; y <= 4; y++) {
      const trunk = new THREE.Mesh(boxGeo, materials.wood);
      trunk.position.set(x, y, z);
      scene.add(trunk);
    }
    for (let lx = -1; lx <= 1; lx++) {
      for (let ly = 4; ly <= 5; ly++) {
        for (let lz = -1; lz <= 1; lz++) {
          if (lx===0 && ly===5 && lz===0) continue;
          const leaf = new THREE.Mesh(boxGeo, materials.leaves);
          leaf.position.set(x + lx, ly, z + lz);
          scene.add(leaf);
        }
      }
    }
  }

  function spawnHouse(x, z) {
    for (let hx = 0; hx < 4; hx++) {
      for (let hz = 0; hz < 4; hz++) {
        for (let hy = 1; hy <= 3; hy++) {
          if (hx === 0 || hx === 3 || hz === 0 || hz === 3) {
            if (hx === 1 && hz === 0 && hy <= 2) continue; // Дверной проем
            const wall = new THREE.Mesh(boxGeo, materials.planks);
            wall.position.set(x + hx, hy, z + hz);
            scene.add(wall);
          }
        }
        const roof = new THREE.Mesh(boxGeo, materials.wood);
        roof.position.set(x + hx, 4, z + hz);
        scene.add(roof);
      }
    }
  }

  spawnTree(4, 4);
  spawnTree(-5, 6);
  spawnTree(6, -5);
  spawnHouse(-6, -6);

  // ==========================================
  // 4. МОБЫ (Житель, Зомби, Овечка)
  // ==========================================
  const mobs = [];
  function createMob(x, z, colorHex, isAnimal = false) {
    const mobGroup = new THREE.Group();
    const mat = new THREE.MeshLambertMaterial({ color: colorHex });
    
    if (isAnimal) {
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.6, 1.2), mat);
      body.position.y = 0.6;
      mobGroup.add(body);
    } else {
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.6, 0.4), mat);
      body.position.y = 0.8;
      mobGroup.add(body);
    }

    mobGroup.position.set(x, 0, z);
    scene.add(mobGroup);
    mobs.push({ mesh: mobGroup, targetX: x, targetZ: z, timer: 0 });
  }

  createMob(2, -2, 0x8b4513); // Житель
  createMob(-2, 3, 0x2e8b57);  // Зомби
  createMob(5, -4, 0xeeeeee, true); // Овечка

  // ==========================================
  // 5. РУКА ИГРОКА
  // ==========================================
  const handGeo = new THREE.BoxGeometry(0.25, 0.7, 0.25);
  const hand = new THREE.Mesh(handGeo, materials.skin);
  hand.position.set(0.35, -0.35, -0.5);
  hand.rotation.set(0.2, -0.1, 0);
  camera.add(hand);
  scene.add(camera);

  camera.position.set(0, 1.7, 0);

  // ==========================================
  // 6. СЕНСОРНОЕ УПРАВЛЕНИЕ (Мобильное)
  // ==========================================
  let moveX = 0, moveZ = 0;
  const joyZone = document.getElementById('joystick-zone');
  const joyKnob = document.getElementById('joystick-knob');
  let joyTouchId = null, joyBaseX = 0, joyBaseY = 0;

  joyZone.addEventListener('touchstart', (e) => {
    const touch = e.changedTouches[0];
    joyTouchId = touch.identifier;
    const rect = joyZone.getBoundingClientRect();
    joyBaseX = rect.left + rect.width / 2;
    joyBaseY = rect.top + rect.height / 2;
  });

  window.addEventListener('touchmove', (e) => {
    for (let touch of e.changedTouches) {
      if (touch.identifier === joyTouchId) {
        let dx = touch.clientX - joyBaseX;
        let dy = touch.clientY - joyBaseY;
        const dist = Math.min(Math.hypot(dx, dy), 40);
        const angle = Math.atan2(dy, dx);

        const knobX = Math.cos(angle) * dist;
        const knobY = Math.sin(angle) * dist;
        joyKnob.style.transform = `translate(${knobX}px, ${knobY}px)`;

        moveX = knobX / 40;
        moveZ = knobY / 40;
      }
    }
  });

  const resetJoystick = (e) => {
    for (let touch of e.changedTouches) {
      if (touch.identifier === joyTouchId) {
        joyTouchId = null;
        joyKnob.style.transform = 'translate(0px, 0px)';
        moveX = 0; moveZ = 0;
      }
    }
  };
  window.addEventListener('touchend', resetJoystick);
  window.addEventListener('touchcancel', resetJoystick);

  // Поворот камеры свайпом справа
  let lookTouchId = null, lastTouchX = 0, lastTouchY = 0;
  let yaw = 0, pitch = 0;

  window.addEventListener('touchstart', (e) => {
    for (let touch of e.changedTouches) {
      if (touch.clientX > window.innerWidth / 2 && lookTouchId === null) {
        lookTouchId = touch.identifier;
        lastTouchX = touch.clientX;
        lastTouchY = touch.clientY;
      }
    }
  });

  window.addEventListener('touchmove', (e) => {
    for (let touch of e.changedTouches) {
      if (touch.identifier === lookTouchId) {
        const dx = touch.clientX - lastTouchX;
        const dy = touch.clientY - lastTouchY;
        
        yaw -= dx * 0.005;
        pitch -= dy * 0.005;
        pitch = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, pitch));

        camera.rotation.order = 'YXZ';
        camera.rotation.y = yaw;
        camera.rotation.x = pitch;

        lastTouchX = touch.clientX;
        lastTouchY = touch.clientY;
      }
    }
  });

  const resetLook = (e) => {
    for (let touch of e.changedTouches) {
      if (touch.identifier === lookTouchId) lookTouchId = null;
    }
  };
  window.addEventListener('touchend', resetLook);
  window.addEventListener('touchcancel', resetLook);

  // ==========================================
  // 7. ЛОГИКА ИНВЕНТАРЯ
  // ==========================================
  const invModal = document.getElementById('inventory-modal');
  const invGrid = document.getElementById('inv-items');
  
  const inventoryData = [
    { name: "Алмазный меч", type: "weapon" },
    { name: "Алмазная кирка", type: "tool" },
    { name: "Алмазная шлем", type: "armor" },
    { name: "Алмазный нагрудник", type: "armor" },
    { name: "Блок Травы", type: "block" },
    { name: "Блок Досок", type: "block" },
    { name: "Блок Камня", type: "block" },
    { name: "Яйцо Жителя", type: "spawn" }
  ];

  let selectedSlotIndex = 0;

  inventoryData.forEach(item => {
    const card = document.createElement('div');
    card.className = 'inv-card';
    card.innerText = item.name;
    card.onclick = () => {
      document.getElementById(`slot-${selectedSlotIndex}`).innerText = item.name;
      invModal.classList.remove('show');
    };
    invGrid.appendChild(card);
  });

  document.getElementById('btn-inv').onclick = () => invModal.classList.add('show');
  document.getElementById('btn-close-inv').onclick = () => invModal.classList.remove('show');

  document.querySelectorAll('.slot').forEach((slot, idx) => {
    slot.onclick = () => {
      document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
      slot.classList.add('active');
      selectedSlotIndex = idx;
    };
  });

  // ==========================================
  // 8. ИГРОВОЙ ЦИКЛ
  // ==========================================
  let handTime = 0;

  function animate() {
    requestAnimationFrame(animate);

    // Движение игрока
    if (moveX !== 0 || moveZ !== 0) {
      const speed = 0.08;
      const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
      forward.y = 0; forward.normalize();
      const side = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
      side.y = 0; side.normalize();

      camera.position.addScaledVector(forward, -moveZ * speed);
      camera.position.addScaledVector(side, moveX * speed);

      // Анимация рук при ходьбе
      handTime += 0.15;
      hand.position.y = -0.35 + Math.sin(handTime) * 0.03;
    }

    // Движение мобов
    mobs.forEach(mob => {
      mob.timer += 0.01;
      if (mob.timer > 3) {
        mob.targetX = mob.mesh.position.x + (Math.random() * 4 - 2);
        mob.targetZ = mob.mesh.position.z + (Math.random() * 4 - 2);
        mob.timer = 0;
      }
      mob.mesh.position.x += (mob.targetX - mob.mesh.position.x) * 0.01;
      mob.mesh.position.z += (mob.targetZ - mob.mesh.position.z) * 0.01;
    });

    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
